name: Boomi CI-CD Deployment
#Just update here
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Boomi CLI
        run: |
          npm install -g boomi-cli

      - name: Install Project Dependencies
        run: |
          npm ci

      - name: Build Project
        run: |
          npm run build

      - name: Configure Boomi Credentials
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_TOKEN: ${{ secrets.BOOMI_TOKEN }}
        run: |
          boomi account login \
            --accountId "${BOOMI_ACCOUNT_ID}" \
            --username "${BOOMI_USERNAME}" \
            --password "${BOOMI_TOKEN}"

      - name: Create Boomi Package
        env:
          BOOMI_PROCESS_ID: ${{ secrets.BOOMI_PROCESS_ID }}
        run: |
          boomi package create \
            --componentId "${BOOMI_PROCESS_ID}" \
            --version "1.0.${{ github.run_number }}"

      - name: Create Package
        id: package
        run: |
          COMPONENT_ID=$(jq -r '.componentId' boomi/pkg/FFtoXML.json)

          RESPONSE=$(curl -X POST \
            http://192.168.0.26:9090/ws/simple/getComponentXML \
            -H "Content-Type: application/json" \
            -d "{\"componentId\":\"$COMPONENT_ID\"}")

          echo "$RESPONSE"

          PACKAGE_ID=$(echo "$RESPONSE" | jq -r '.packageId')

          echo "PACKAGE_ID=$PACKAGE_ID" >> "$GITHUB_ENV"

      - name: Deploy to Boomi
        env:
          BOOMI_ENVIRONMENT: ${{ secrets.BOOMI_ENVIRONMENT }}
        run: |
          boomi deploy \
            --package ./boomi-package.zip \
            --environment "${BOOMI_ENVIRONMENT}"

      - name: Activate Process
        env:
          BOOMI_PROCESS_ID: ${{ secrets.BOOMI_PROCESS_ID }}
          BOOMI_ATOM_ID: ${{ vars.BOOMI_ATOM_ID }}
        run: |
          boomi process activate \
            --processId "${BOOMI_PROCESS_ID}" \
            --atomId "${BOOMI_ATOM_ID}"
            